<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Nova Raiders</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#65aee7;font-family:Arial,sans-serif;touch-action:none}
    canvas{display:block;width:100%;height:100%}
    #hud{position:fixed;inset:0;pointer-events:none;color:#fff;display:none;text-shadow:2px 2px 3px #000}
    #healthWrap{position:absolute;left:32px;bottom:28px;width:min(320px,36vw)}
    #healthLabel{font-weight:900;font-size:16px;margin-bottom:4px}#health{height:18px;border:3px solid #fff;background:#444;border-radius:20px;overflow:hidden}#healthFill{height:100%;width:100%;background:#62e45c}
    #ammo{position:absolute;right:38px;bottom:25px;font-size:28px;font-weight:900;text-align:right}#ammo small{display:block;font-size:13px}
    #score{position:absolute;top:22px;right:28px;text-align:right;font-size:24px;font-weight:900}
    #cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:white;box-shadow:0 0 2px #000}#cross:before{width:18px;height:2px;top:8px}#cross:after{width:2px;height:18px;left:8px}
    #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5b9ec5,#bce8df)}
    .card{text-align:center;background:rgba(20,34,65,.86);color:white;padding:34px;border-radius:24px;border:3px solid rgba(255,255,255,.25);box-shadow:0 20px 70px #1a3d66;width:min(520px,90vw)}
    h1{margin:0;font-size:54px;font-style:italic;letter-spacing:-3px;text-shadow:4px 4px #8e50d5}h1 span{color:#ffd73d}.tag{margin:8px 0 26px;color:#cae3ff}button{pointer-events:auto;border:0;border-radius:12px;padding:16px 28px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#ffc948,#ee7f27);box-shadow:0 6px 0 #9c4b1d;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 2px 0 #9c4b1d}
    .controls{margin-top:22px;font-size:13px;color:#bcd5ee;line-height:1.7}#hit{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);color:#ffdf55;font-size:44px;font-weight:900;opacity:0}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="menu"><div class="card"><h1>NOVA <span>RAIDERS</span></h1><p class="tag">DÜŞMANLARI DEVİR • PUAN TOPLA • HAYATTA KAL</p><button id="start">OYUNA BAŞLA</button><div class="controls">WASD: Hareket &nbsp; SPACE: Zıpla &nbsp; Mouse: Bakış<br>Sol Tık: Ateş &nbsp; R: Şarjör &nbsp; Shift: Koş</div></div></div>
  <div id="hud"><div id="cross"></div><div id="hit">HIT!</div><div id="score">PUAN<br><b id="scoreValue">0</b></div><div id="healthWrap"><div id="healthLabel">SAĞLIK 100</div><div id="health"><div id="healthFill"></div></div></div><div id="ammo"><span id="ammoValue">30</span> / 180<small>FÜZELİ TÜFEK</small></div></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    const canvas=document.getElementById('game'), hud=document.getElementById('hud'), menu=document.getElementById('menu');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    const scene=new THREE.Scene();scene.background=new THREE.Color(0x71b8df);scene.fog=new THREE.Fog(0x71b8df,45,110);
    const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,500);camera.rotation.order='YXZ';
    scene.add(new THREE.HemisphereLight(0xc7e8ff,0x5b7135,2));const sun=new THREE.DirectionalLight(0xfff1c2,2.5);sun.position.set(-30,60,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
    const ground=new THREE.Mesh(new THREE.CircleGeometry(70,48),new THREE.MeshStandardMaterial({color:0x72b84a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    // Map: trees and colorful buildings
    for(let i=0;i<35;i++){const a=Math.random()*Math.PI*2,r=18+Math.random()*42,x=Math.cos(a)*r,z=Math.sin(a)*r;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.45,.7,4,8),new THREE.MeshStandardMaterial({color:0x79502d}));trunk.position.set(x,2,z);trunk.castShadow=true;scene.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(2.5,5,9),new THREE.MeshStandardMaterial({color:i%3?0x3c9b38:0x55b84a}));crown.position.set(x,6,z);crown.castShadow=true;scene.add(crown)}
    for(let i=0;i<12;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(5+Math.random()*5,4+Math.random()*5,5+Math.random()*5),new THREE.MeshStandardMaterial({color:[0xe69a62,0x8ec5ca,0xb78bd6,0xe0ce72][i%4]}));const a=i/12*Math.PI*2,r=16+Math.random()*23;b.position.set(Math.cos(a)*r,b.geometry.parameters.height/2,Math.sin(a)*r);b.castShadow=true;b.receiveShadow=true;scene.add(b)}
    // Player visual
    const gun=new THREE.Group();const barrel=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.9),new THREE.MeshStandardMaterial({color:0x24272d,metalness:.6}));barrel.position.z=-.55;gun.add(barrel);const body=new THREE.Mesh(new THREE.BoxGeometry(.28,.22,.65),new THREE.MeshStandardMaterial({color:0x586173,metalness:.3}));gun.add(body);camera.add(gun);gun.position.set(.38,-.32,-.55);scene.add(camera);
    const enemies=[], bullets=[];let score=0,health=100,ammo=30,reserve=180,alive=true,canShoot=true,yVel=0,onGround=true;
    function makeEnemy(){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x5a4caa});const torso=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.5,1),mat);torso.position.y=2.15;torso.castShadow=true;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.48,12,8),new THREE.MeshStandardMaterial({color:0xc58e64}));head.position.y=3.35;head.castShadow=true;g.add(head);const a=Math.random()*Math.PI*2,r=28+Math.random()*18;g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.userData={hp:100,walk:Math.random()*4};scene.add(g);enemies.push(g)}
    for(let i=0;i<9;i++)makeEnemy();
    const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload()});addEventListener('keyup',e=>keys[e.code]=false);
    addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){camera.rotation.y-=e.movementX*.0022;camera.rotation.x-=e.movementY*.0022;camera.rotation.x=Math.max(-1.45,Math.min(1.45,camera.rotation.x))}});
    canvas.addEventListener('click',()=>{if(alive&&document.pointerLockElement!==canvas)canvas.requestPointerLock()});
    addEventListener('mousedown',e=>{if(e.button===0&&alive&&document.pointerLockElement===canvas)shoot()});
    document.getElementById('start').onclick=()=>{alive=true;menu.style.display='none';hud.style.display='block';camera.position.set(0,2.1,12);canvas.requestPointerLock()};
    function reload(){if(ammo===30||reserve<=0)return;const need=30-ammo,take=Math.min(need,reserve);ammo+=take;reserve-=take;document.getElementById('ammoValue').textContent=ammo}
    function shoot(){if(!canShoot||ammo<=0)return;ammo--;document.getElementById('ammoValue').textContent=ammo;canShoot=false;setTimeout(()=>canShoot=true,110);const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(enemies,true);if(hits.length){let obj=hits[0].object;while(obj.parent&&!enemies.includes(obj))obj=obj.parent;if(enemies.includes(obj)){obj.userData.hp-=34;document.getElementById('hit').style.opacity=1;setTimeout(()=>document.getElementById('hit').style.opacity=0,150);if(obj.userData.hp<=0){scene.remove(obj);enemies.splice(enemies.indexOf(obj),1);score+=100;document.getElementById('scoreValue').textContent=score;setTimeout(makeEnemy,1800)}}}}
    const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(alive){const dir=new THREE.Vector3(),forward=new THREE.Vector3(-Math.sin(camera.rotation.y),0,-Math.cos(camera.rotation.y)),right=new THREE.Vector3(Math.cos(camera.rotation.y),0,-Math.sin(camera.rotation.y));if(keys.KeyW)dir.add(forward);if(keys.KeyS)dir.sub(forward);if(keys.KeyD)dir.add(right);if(keys.KeyA)dir.sub(right);if(dir.length())dir.normalize().multiplyScalar(keys.ShiftLeft?11:7);camera.position.addScaledVector(dir,dt);camera.position.x=Math.max(-68,Math.min(68,camera.position.x));camera.position.z=Math.max(-68,Math.min(68,camera.position.z));if(keys.Space&&onGround){yVel=7.5;onGround=false}yVel-=18*dt;camera.position.y+=yVel*dt;if(camera.position.y<=2.1){camera.position.y=2.1;yVel=0;onGround=true}
      enemies.forEach(e=>{const to=camera.position.clone().sub(e.position);to.y=0;const d=to.length();if(d>1.8&&d<55){to.normalize();e.position.addScaledVector(to,dt*(1.8+(score/900)));e.lookAt(camera.position.x,e.position.y,camera.position.z)}if(d<3){health-=12*dt;health=Math.max(0,health);document.getElementById('healthFill').style.width=health+'%';document.getElementById('healthLabel').textContent='SAĞLIK '+Math.ceil(health);if(health<=0){alive=false;document.exitPointerLock();menu.style.display='flex';menu.querySelector('h1').innerHTML='OYUN <span>BİTTİ</span>';document.querySelector('#start').textContent='YENİDEN OYNA';hud.style.display='none'}}})}
    renderer.render(scene,camera)}animate();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  </script>
</body>
</html>
