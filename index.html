<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GHOST // Shadow Protocol</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#08141f;touch-action:none}canvas{display:block;width:100%;height:100%}
#menu{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#294d67 0,#101d29 42%,#06090d 100%)}#menu:after{content:"";position:absolute;inset:0;opacity:.12;background:linear-gradient(115deg,transparent 48%,#8ddfff 49%,transparent 51%),repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 7px)}
.panel{position:relative;width:min(650px,92vw);padding:44px 30px 30px;text-align:center;color:#fff;border:1px solid #8fe4ff66;border-radius:8px;background:linear-gradient(135deg,#0b1a26d9,#0b1019ed);box-shadow:0 0 80px #55cfff33,inset 0 0 80px #53c8ff12;clip-path:polygon(4% 0,96% 0,100% 8%,100% 92%,96% 100%,4% 100%,0 92%,0 8%)}h1{margin:0;font-size:clamp(60px,14vw,105px);line-height:.75;letter-spacing:-8px;font-weight:1000;text-transform:uppercase;text-shadow:5px 5px 0 #174c69}h1 span{display:block;margin-top:15px;font-size:.21em;letter-spacing:16px;color:#82e4ff}.tag{margin:28px 0 24px;font-size:14px;letter-spacing:5px;color:#a6bdd0}button{border:1px solid #aeeaff;border-radius:3px;padding:16px 44px;font-size:18px;font-weight:900;letter-spacing:3px;color:#08131b;background:linear-gradient(135deg,#b4efff,#58c4e8);box-shadow:0 0 25px #69d9ff55;cursor:pointer}button:active{transform:translateY(2px)}.mode{display:flex;justify-content:center;gap:10px;margin:22px 0 0}.mode i{width:8px;height:8px;background:#66d6ff;border-radius:50%;box-shadow:0 0 10px #66d6ff}.controls{margin-top:18px;color:#9bb3c4;font-size:12px;line-height:1.9;letter-spacing:1px}
#hud{position:fixed;inset:0;z-index:10;display:none;pointer-events:none;color:#effaff;text-shadow:1px 2px 3px #061017}#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#dfffff;box-shadow:0 0 5px #67dfff}#cross:before{left:-10px;top:12px;width:46px;height:1px}#cross:after{left:12px;top:-10px;width:1px;height:46px}#ammo{position:absolute;right:30px;bottom:26px;text-align:right;font-size:35px;font-weight:900}#ammo small{display:block;font-size:11px;letter-spacing:3px;color:#9cdcf1}#healthPanel{position:absolute;left:28px;bottom:30px;width:min(340px,38vw)}#healthLabel{font-size:12px;letter-spacing:3px;margin-bottom:7px}#health{height:18px;border:1px solid #a9eaff;background:#17243088;overflow:hidden}#healthFill{height:100%;width:100%;background:linear-gradient(90deg,#39d98a,#86f2d1)}#score{position:absolute;right:24px;top:20px;text-align:right;font-size:17px;letter-spacing:2px}#score b{display:block;font-size:29px;color:#8feaff}#mission{position:absolute;left:24px;top:20px;padding:10px 14px;border-left:2px solid #69daf8;background:#0a161fbb;font-size:12px;letter-spacing:2px}#hit{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:22px;letter-spacing:5px;color:#aeeeff;opacity:0}#wave{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:16px;font-weight:900;letter-spacing:6px;color:#fff}#damageFlash{position:fixed;inset:0;z-index:9;pointer-events:none;box-shadow:inset 0 0 0 transparent;transition:.12s}
#mobile{display:none;position:fixed;inset:0;z-index:12;pointer-events:none}#stick{position:absolute;left:24px;bottom:88px;width:118px;height:118px;border:1px solid #b9efff88;border-radius:50%;background:#80cef21a}#stickDot{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#c8efff55}#fire{position:absolute;right:25px;bottom:92px;width:82px;height:82px;border:1px solid #d3f7ff;border-radius:50%;background:#65cfee55;pointer-events:auto}#jump{position:absolute;right:35px;bottom:188px;width:62px;height:62px;border:1px solid #d3f7ff;border-radius:50%;background:#9ae6ff44;pointer-events:auto}@media(pointer:coarse){#mobile{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu"><div class="panel"><h1>GHOST <span>SHADOW PROTOCOL</span></h1><p class="tag">OPERASYONBAŞLATILDI</p><button id="start">İNSALLA</button><div class="mode"><i></i><i></i><i></i></div><div class="controls">WASD Hareket • Fare Bakış • Sol Tık Ateş<br>Boşluk Zıpla • Shift Koş • R Şarjör • E Mühimmat</div></div></div>
<div id="damageFlash"></div><div id="hud"><div id="cross"></div><div id="hit">HIT CONFIRMED</div><div id="mission">BÖLGE // NEON DISTRICT</div><div id="wave">DALGA <span id="waveValue">1</span></div><div id="score">PUAN<b id="scoreValue">0</b></div><div id="healthPanel"><div id="healthLabel">GHOST // VITAL 100</div><div id="health"><div id="healthFill"></div></div></div><div id="ammo"><span id="ammoValue">30</span> / <span id="reserveValue">150</span><small>VX-27</small></div></div>
<div id="mobile"><div id="stick"><div id="stickDot"></div></div><button id="fire"></button><button id="jump"></button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.getElementById('game'),menu=document.getElementById('menu'),hud=document.getElementById('hud');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x091720);scene.fog=new THREE.FogExp2(0x091720,.012);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,650);camera.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0x84c8df,0x18211c,2));const sun=new THREE.DirectionalLight(0xa9e1ff,2.1);sun.position.set(-40,75,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(105,64),new THREE.MeshStandardMaterial({color:0x26372f,roughness:.9,metalness:.05}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// Neon operation district
const roadMat=new THREE.MeshStandardMaterial({color:0x172229,roughness:.62,metalness:.12});for(let i=-3;i<=3;i++){const road=new THREE.Mesh(new THREE.BoxGeometry(12,0.08,210),roadMat);road.position.set(i*24,.04,0);road.receiveShadow=true;scene.add(road)}
for(let i=-4;i<=4;i++){const road=new THREE.Mesh(new THREE.BoxGeometry(210,.09,9),roadMat);road.position.set(0,.05,i*23);road.receiveShadow=true;scene.add(road)}
const buildingColors=[0x263a4b,0x31485a,0x4a3d63,0x38545d,0x53364f];
for(let gx=-3;gx<=3;gx++)for(let gz=-4;gz<=4;gz++){if(Math.abs(gx)<=1&&Math.abs(gz)<=1)continue;if(Math.random()<.22)continue;const w=10+Math.random()*8,h=12+Math.random()*28,d=10+Math.random()*8;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:buildingColors[(gx+gz+7)%buildingColors.length],roughness:.72,metalness:.18}));b.position.set(gx*24+(Math.random()-0.5)*5,h/2,gz*23+(Math.random()-0.5)*5);b.castShadow=true;b.receiveShadow=true;scene.add(b);const cap=new THREE.Mesh(new THREE.BoxGeometry(w+.8,.7,d+.8),new THREE.MeshStandardMaterial({color:0x1c2d39,metalness:.4}));cap.position.set(b.position.x,h+.35,b.position.z);scene.add(cap);for(let y=3;y<h-2;y+=4){const row=new THREE.Mesh(new THREE.BoxGeometry(w+.02,.55,d+.02),new THREE.MeshBasicMaterial({color:Math.random()<.5?0x56d6ff:0xff6e9d,transparent:true,opacity:.28}));row.position.set(b.position.x,y,b.position.z);scene.add(row)}}
// Cover objects
for(let i=0;i<34;i++){const a=Math.random()*Math.PI*2,r=18+Math.random()*65,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<10&&Math.abs(z)<10)continue;const crate=new THREE.Mesh(new THREE.BoxGeometry(3,2.2,3),new THREE.MeshStandardMaterial({color:i%3?0x5f6f73:0x8a7651,roughness:.75,metalness:.15}));crate.position.set(x,1.1,z);crate.rotation.y=Math.random()*Math.PI;crate.castShadow=true;crate.receiveShadow=true;scene.add(crate)}
// Central extraction beacon
const beacon=new THREE.Mesh(new THREE.CylinderGeometry(2.2,3.2,9,12),new THREE.MeshStandardMaterial({color:0x243d4b,metalness:.65,roughness:.25}));beacon.position.set(0,4.5,0);beacon.castShadow=true;scene.add(beacon);const ring=new THREE.Mesh(new THREE.TorusGeometry(4.5,.12,8,48),new THREE.MeshBasicMaterial({color:0x73dcff}));ring.rotation.x=Math.PI/2;ring.position.y=.55;scene.add(ring);
// Weapon
const gun=new THREE.Group();const stock=new THREE.Mesh(new THREE.BoxGeometry(.32,.28,.75),new THREE.MeshStandardMaterial({color:0x111b22,metalness:.7,roughness:.25}));stock.position.z=-.15;gun.add(stock);const body=new THREE.Mesh(new THREE.BoxGeometry(.38,.24,1),new THREE.MeshStandardMaterial({color:0x28343c,metalness:.82,roughness:.18}));body.position.z=-.65;gun.add(body);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.055,.065,.95,12),new THREE.MeshStandardMaterial({color:0x0b1014,metalness:.9}));barrel.rotation.x=Math.PI/2;barrel.position.set(0,.02,-1.35);gun.add(barrel);const optic=new THREE.Mesh(new THREE.BoxGeometry(.16,.12,.32),new THREE.MeshStandardMaterial({color:0x78d9ff,emissive:0x1a728e,emissiveIntensity:.7}));optic.position.set(0,.23,-.72);gun.add(optic);gun.position.set(.38,-.32,-.55);camera.add(gun);scene.add(camera);
const enemies=[];let score=0,health=100,ammo=30,reserve=150,alive=true,canFire=true,yVel=0,onGround=true,wave=1;
function makeEnemy(){const g=new THREE.Group();const armor=new THREE.MeshStandardMaterial({color:0x1b2028,roughness:.55,metalness:.35});for(const x of [-.34,.34]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.19,.72,4,8),armor);leg.position.set(x,.95,0);leg.castShadow=true;g.add(leg)}const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.5,1.05,5,10),new THREE.MeshStandardMaterial({color:0x303a44,roughness:.6,metalness:.28}));torso.position.y=2.05;torso.castShadow=true;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.43,14,8),new THREE.MeshStandardMaterial({color:0x0b1117,roughness:.38,metalness:.55}));head.position.y=3.31;head.castShadow=true;g.add(head);const visor=new THREE.Mesh(new THREE.BoxGeometry(.72,.12,.12),new THREE.MeshBasicMaterial({color:0xff4f70}));visor.position.set(0,3.35,-.39);g.add(visor);const a=Math.random()*Math.PI*2,r=28+Math.random()*58;g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.userData.hp=70+wave*12;g.userData.speed=.9+wave*.09;scene.add(g);enemies.push(g)}
for(let i=0;i<9;i++)makeEnemy();
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='KeyE')pickAmmo()});addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){camera.rotation.y-=e.movementX*.0023;camera.rotation.x-=e.movementY*.0023;camera.rotation.x=Math.max(-1.42,Math.min(1.42,camera.rotation.x))}});canvas.addEventListener('click',()=>{if(alive&&document.pointerLockElement!==canvas)canvas.requestPointerLock()});addEventListener('mousedown',e=>{if(e.button===0&&alive&&document.pointerLockElement===canvas)fire()});
document.getElementById('start').onclick=()=>{alive=true;menu.style.display='none';hud.style.display='block';camera.position.set(0,2.15,14);canvas.requestPointerLock()};
function reload(){if(ammo===30||reserve<=0)return;const take=Math.min(30-ammo,reserve);ammo+=take;reserve-=take;document.getElementById('ammoValue').textContent=ammo;document.getElementById('reserveValue').textContent=reserve}function pickAmmo(){reserve=Math.min(240,reserve+45);document.getElementById('reserveValue').textContent=reserve}
function fire(){if(!canFire||ammo<=0)return;ammo--;document.getElementById('ammoValue').textContent=ammo;canFire=false;gun.position.z=-.42;setTimeout(()=>{gun.position.z=-.55;canFire=true},105);const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(enemies,true);if(hits.length){let obj=hits[0].object;while(obj.parent&&!enemies.includes(obj))obj=obj.parent;if(enemies.includes(obj)){obj.userData.hp-=34;const hit=document.getElementById('hit');hit.style.opacity=1;setTimeout(()=>hit.style.opacity=0,140);if(obj.userData.hp<=0){scene.remove(obj);enemies.splice(enemies.indexOf(obj),1);score+=150;document.getElementById('scoreValue').textContent=score;if(enemies.length===0){wave++;document.getElementById('waveValue').textContent=wave;reserve+=40;health=Math.min(100,health+18);for(let i=0;i<7+wave;i++)setTimeout(makeEnemy,i*130)}}}}}
let stickX=0,stickY=0;const stick=document.getElementById('stick'),dot=document.getElementById('stickDot');stick.addEventListener('pointermove',e=>{const r=stick.getBoundingRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),m=Math.min(d,42),a=Math.atan2(y,x);stickX=Math.cos(a)*m/42;stickY=Math.sin(a)*m/42;dot.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`});stick.addEventListener('pointerup',()=>{stickX=stickY=0;dot.style.transform=''});document.getElementById('fire').addEventListener('pointerdown',fire);document.getElementById('jump').addEventListener('pointerdown',()=>{if(onGround){yVel=7.7;onGround=false}});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(alive){const dir=new THREE.Vector3(),forward=new THREE.Vector3(-Math.sin(camera.rotation.y),0,-Math.cos(camera.rotation.y)),right=new THREE.Vector3(Math.cos(camera.rotation.y),0,-Math.sin(camera.rotation.y));if(keys.KeyW||stickY<-.25)dir.add(forward);if(keys.KeyS||stickY>.25)dir.sub(forward);if(keys.KeyD||stickX>.25)dir.add(right);if(keys.KeyA||stickX<-.25)dir.sub(right);if(dir.length())dir.normalize().multiplyScalar(keys.ShiftLeft?13:8);camera.position.addScaledVector(dir,dt);camera.position.x=Math.max(-78,Math.min(78,camera.position.x));camera.position.z=Math.max(-78,Math.min(78,camera.position.z));if(keys.Space&&onGround){yVel=7.7;onGround=false}yVel-=19*dt;camera.position.y+=yVel*dt;if(camera.position.y<=2.15){camera.position.y=2.15;yVel=0;onGround=true}enemies.forEach(e=>{const to=camera.position.clone().sub(e.position);to.y=0;const d=to.length();if(d>2.3&&d<70){to.normalize();e.position.addScaledVector(to,dt*e.userData.speed);e.lookAt(camera.position.x,e.position.y,camera.position.z)}if(d<3.2){health=Math.max(0,health-10*dt);document.getElementById('healthFill').style.width=health+'%';document.getElementById('healthLabel').textContent='GHOST // VITAL '+Math.ceil(health);const flash=document.getElementById('damageFlash');flash.style.boxShadow='inset 0 0 90px #ff3155bb';setTimeout(()=>flash.style.boxShadow='inset 0 0 0 transparent',90);if(health<=0){alive=false;document.exitPointerLock();menu.style.display='grid';menu.querySelector('h1').innerHTML='GHOST <span>PROTOKOL ÇÖKTÜ</span>';document.getElementById('start').textContent='TEKRAR BAŞLAT';hud.style.display='none'}}})}ring.rotation.z+=dt*.35;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
