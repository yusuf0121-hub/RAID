<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Nova Island</title>
  <style>
    :root{--blue:#58b8ff;--yellow:#ffe36b;--ink:#17254a}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
    #menu{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(165deg,#79cfff 0,#b5efff 48%,#65be69 49%,#54a64e 100%)}#menu:before{content:"";position:absolute;inset:14% 0 auto 0;height:38%;opacity:.5;background:repeating-linear-gradient(120deg,transparent 0 70px,#fff 71px 74px,transparent 75px 150px)}
    .panel{position:relative;width:min(560px,92vw);padding:38px 28px 28px;text-align:center;color:white;border:4px solid rgba(255,255,255,.75);border-radius:28px;background:linear-gradient(135deg,#263b80dd,#612bb1cc);box-shadow:0 25px 70px #23305a66, inset 0 0 40px #ffffff1a}h1{margin:0;font-size:clamp(46px,11vw,78px);line-height:.85;font-style:italic;letter-spacing:-5px;text-shadow:5px 7px 0 #1b2866}h1 span{display:block;color:#ffe16a;font-size:.64em;letter-spacing:1px}.tagline{margin:18px 0 22px;font-weight:900;color:#dff7ff}#start{border:0;border-radius:14px;padding:17px 38px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(#ffcf42,#f58a27);box-shadow:0 7px 0 #b85a22;cursor:pointer}#start:active{transform:translateY(5px);box-shadow:0 2px 0 #b85a22}.controls{margin-top:24px;color:#dceaff;font-size:13px;line-height:1.8}
    #hud{position:fixed;inset:0;z-index:10;display:none;pointer-events:none;color:#fff;text-shadow:2px 2px 3px #111}#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;box-shadow:0 0 3px #000}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}#cross:before{width:30px;height:2px;left:-6px;top:8px}#cross:after{height:30px;width:2px;top:-6px;left:8px}#healthWrap{position:absolute;left:28px;bottom:30px;width:min(330px,38vw)}#healthLabel{font-size:14px;font-weight:900;margin-bottom:5px}#health{height:22px;border:3px solid #fff;border-radius:20px;overflow:hidden;background:#553;box-shadow:0 3px 10px #0008}#healthFill{width:100%;height:100%;background:linear-gradient(90deg,#54df55,#9afa54)}#ammo{position:absolute;right:30px;bottom:28px;font-size:32px;font-weight:900}#ammo small{display:block;text-align:right;font-size:12px}#score{position:absolute;top:18px;right:24px;font-size:20px;font-weight:900;text-align:right}#zone{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:14px;font-weight:900;background:#18285bbb;border:2px solid #fff;padding:8px 16px;border-radius:20px}#hit{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:38px;font-weight:900;color:#fff36b;opacity:0}
    #mobile{display:none;position:fixed;inset:0;z-index:12;pointer-events:none}#stick{position:absolute;left:25px;bottom:100px;width:120px;height:120px;border:3px solid #ffffff88;border-radius:50%;background:#ffffff20}#stickDot{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:#ffffff55}#mobileFire{position:absolute;right:30px;bottom:115px;width:86px;height:86px;border:3px solid #fff;border-radius:50%;background:#ffb02a88;pointer-events:auto}#mobileJump{position:absolute;right:40px;bottom:210px;width:70px;height:70px;border:3px solid #fff;border-radius:50%;background:#73ddff88;pointer-events:auto}@media(pointer:coarse){#mobile{display:block}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="menu"><div class="panel"><h1>NOVA <span>ISLAND</span></h1><p class="tagline">İNŞA ET • TOPLAN • HAYATTA KAL</p><button id="start">OYUNA BAŞLA</button><div class="controls">WASD Hareket &nbsp; • &nbsp; Fare Bakış &nbsp; • &nbsp; Sol Tık Ateş<br>Boşluk Zıpla &nbsp; • &nbsp; R Şarjör &nbsp; • &nbsp; Shift Koş</div></div></div>
  <div id="hud"><div id="cross"></div><div id="hit">VURDUN!</div><div id="zone">GÜVENLİ BÖLGE</div><div id="score">ELİMİNASYON<br><b id="scoreValue">0</b></div><div id="healthWrap"><div id="healthLabel">SAĞLIK 100</div><div id="health"><div id="healthFill"></div></div></div><div id="ammo"><span id="ammoValue">30</span> / 150<small>TORPEDO-X</small></div></div>
  <div id="mobile"><div id="stick"><div id="stickDot"></div></div><button id="mobileFire"></button><button id="mobileJump"></button></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    const canvas=document.getElementById('game'),hud=document.getElementById('hud'),menu=document.getElementById('menu');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    const scene=new THREE.Scene();scene.background=new THREE.Color(0x77c7ef);scene.fog=new THREE.Fog(0x77c7ef,55,145);
    const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,500);camera.rotation.order='YXZ';
    scene.add(new THREE.HemisphereLight(0xc8efff,0x5e7041,2.4));const sun=new THREE.DirectionalLight(0xfff2c2,2.8);sun.position.set(-35,70,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
    const ground=new THREE.Mesh(new THREE.CircleGeometry(82,64),new THREE.MeshStandardMaterial({color:0x69ad45,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    // Şehir adası: renkli evler, platformlar, ağaçlar ve kale yapıları
    const colors=[0xff805c,0x7cc8f4,0xffce58,0xa889e8,0x73cda2];
    for(let i=0;i<16;i++){const angle=i/16*Math.PI*2,r=22+(i%3)*7,x=Math.cos(angle)*r,z=Math.sin(angle)*r,h=4+(i%4)*2;const house=new THREE.Mesh(new THREE.BoxGeometry(5, h, 5),new THREE.MeshStandardMaterial({color:colors[i%colors.length],roughness:.8}));house.position.set(x,h/2,z);house.castShadow=true;house.receiveShadow=true;scene.add(house);const roof=new THREE.Mesh(new THREE.ConeGeometry(4.2,h*.55,4),new THREE.MeshStandardMaterial({color:i%2?0x3f65af:0x7250bb}));roof.position.set(x,h+h*.275,z);roof.rotation.y=Math.PI/4;roof.castShadow=true;scene.add(roof)}
    for(let i=0;i<42;i++){const angle=Math.random()*Math.PI*2,r=16+Math.random()*55,x=Math.cos(angle)*r,z=Math.sin(angle)*r;if(Math.abs(x)<8&&z>-15&&z<20)continue;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,3.5,7),new THREE.MeshStandardMaterial({color:0x7b5635}));trunk.position.set(x,1.75,z);trunk.castShadow=true;scene.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.8,9,7),new THREE.MeshStandardMaterial({color:i%4?0x45a34a:0x72b94d}));crown.position.set(x,4.6,z);crown.scale.y=1.35;crown.castShadow=true;scene.add(crown)}
    for(let i=0;i<10;i++){const tower=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,5+i%3,10),new THREE.MeshStandardMaterial({color:0xb6a0d8,roughness:.7}));const a=i/10*Math.PI*2,r=38;tower.position.set(Math.cos(a)*r,2.5,Math.sin(a)*r);tower.castShadow=true;scene.add(tower)}
    // Karakter ve silah geometrileri basit ve hızlı şekilde hazırlanır
    const gun=new THREE.Group();const weaponBody=new THREE.Mesh(new THREE.BoxGeometry(.28,.22,.9),new THREE.MeshStandardMaterial({color:0x38445a,metalness:.5,roughness:.25}));weaponBody.position.z=-.5;gun.add(weaponBody);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.8,12),new THREE.MeshStandardMaterial({color:0x202734,metalness:.8}));barrel.rotation.x=Math.PI/2;barrel.position.set(0,.04,-1.05);gun.add(barrel);const accent=new THREE.Mesh(new THREE.BoxGeometry(.16,.08,.55),new THREE.MeshStandardMaterial({color:0x55a9ff,emissive:0x123d77,emissiveIntensity:.5}));accent.position.set(0,-.1,-.72);gun.add(accent);gun.position.set(.38,-.32,-.55);camera.add(gun);scene.add(camera);
    const enemies=[];let score=0,health=100,ammo=30,reserve=150,alive=true,canShoot=true,yVel=0,onGround=true;
    function makeEnemy(){const g=new THREE.Group();const legMat=new THREE.MeshStandardMaterial({color:0x3d3157});for(const side of [-.34,.34]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.75,4,8),legMat);leg.position.set(side,1.05,0);leg.castShadow=true;g.add(leg)}const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.52,1.05,5,10),new THREE.MeshStandardMaterial({color:0x6c55a5,roughness:.7}));torso.position.y=2.15;torso.castShadow=true;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.48,12,8),new THREE.MeshStandardMaterial({color:0xd19a72,roughness:.8}));head.position.y=3.42;head.castShadow=true;g.add(head);const cap=new THREE.Mesh(new THREE.SphereGeometry(.52,12,6,0,Math.PI*2,0,Math.PI*.42),new THREE.MeshStandardMaterial({color:0xffcf45}));cap.position.y=3.72;g.add(cap);const a=Math.random()*Math.PI*2,r=30+Math.random()*25;g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.userData={hp:100};scene.add(g);enemies.push(g)}
    for(let i=0;i<11;i++)makeEnemy();
    const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload()});addEventListener('keyup',e=>keys[e.code]=false);
    addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){camera.rotation.y-=e.movementX*.0024;camera.rotation.x-=e.movementY*.0024;camera.rotation.x=Math.max(-1.42,Math.min(1.42,camera.rotation.x))}});canvas.addEventListener('click',()=>{if(alive&&document.pointerLockElement!==canvas)canvas.requestPointerLock()});addEventListener('mousedown',e=>{if(e.button===0&&alive&&document.pointerLockElement===canvas)shoot()});
    document.getElementById('start').onclick=()=>{alive=true;menu.style.display='none';hud.style.display='block';camera.position.set(0,2.15,14);canvas.requestPointerLock()};
    function reload(){if(ammo===30||reserve<=0)return;const take=Math.min(30-ammo,reserve);ammo+=take;reserve-=take;document.getElementById('ammoValue').textContent=ammo}
    function shoot(){if(!canShoot||ammo<=0)return;ammo--;document.getElementById('ammoValue').textContent=ammo;canShoot=false;gun.position.z=-.45;setTimeout(()=>{gun.position.z=-.55;canShoot=true},110);const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(enemies,true);if(hits.length){let obj=hits[0].object;while(obj.parent&&!enemies.includes(obj))obj=obj.parent;if(enemies.includes(obj)){obj.userData.hp-=34;const hit=document.getElementById('hit');hit.style.opacity=1;setTimeout(()=>hit.style.opacity=0,130);if(obj.userData.hp<=0){scene.remove(obj);enemies.splice(enemies.indexOf(obj),1);score++;document.getElementById('scoreValue').textContent=score;setTimeout(makeEnemy,1500)}}}}
    // Mobil joystick ve ateş
    let stickX=0,stickY=0;const stick=document.getElementById('stick'),stickDot=document.getElementById('stickDot');stick.addEventListener('pointermove',e=>{const r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),m=Math.min(d,42),a=Math.atan2(y,x);stickX=Math.cos(a)*m/42;stickY=Math.sin(a)*m/42;stickDot.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`});stick.addEventListener('pointerup',()=>{stickX=stickY=0;stickDot.style.transform=''});document.getElementById('mobileFire').addEventListener('pointerdown',shoot);document.getElementById('mobileJump').addEventListener('pointerdown',()=>{if(onGround){yVel=7.5;onGround=false}});
    const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(alive){const dir=new THREE.Vector3(),forward=new THREE.Vector3(-Math.sin(camera.rotation.y),0,-Math.cos(camera.rotation.y)),right=new THREE.Vector3(Math.cos(camera.rotation.y),0,-Math.sin(camera.rotation.y));if(keys.KeyW||stickY<-.25)dir.add(forward);if(keys.KeyS||stickY>.25)dir.sub(forward);if(keys.KeyD||stickX>.25)dir.add(right);if(keys.KeyA||stickX<-.25)dir.sub(right);if(dir.length())dir.normalize().multiplyScalar(keys.ShiftLeft?11:7);camera.position.addScaledVector(dir,dt);camera.position.x=Math.max(-72,Math.min(72,camera.position.x));camera.position.z=Math.max(-72,Math.min(72,camera.position.z));if(keys.Space&&onGround){yVel=7.5;onGround=false}yVel-=18*dt;camera.position.y+=yVel*dt;if(camera.position.y<=2.15){camera.position.y=2.15;yVel=0;onGround=true}enemies.forEach(e=>{const to=camera.position.clone().sub(e.position);to.y=0;const d=to.length();if(d>2.2&&d<58){to.normalize();e.position.addScaledVector(to,dt*(1.9+score*.003));e.lookAt(camera.position.x,e.position.y,camera.position.z)}if(d<3){health=Math.max(0,health-11*dt);document.getElementById('healthFill').style.width=health+'%';document.getElementById('healthLabel').textContent='SAĞLIK '+Math.ceil(health);if(health<=0){alive=false;document.exitPointerLock();menu.style.display='grid';menu.querySelector('h1').innerHTML='OYUN <span>BİTTİ</span>';document.querySelector('#start').textContent='YENİDEN OYNA';hud.style.display='none'}}})}renderer.render(scene,camera)}animate();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  </script>
</body>
</html>
